<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI風性格クイズ</title>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
    crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ede9fe, #eef2ff);
      color: #333;
      text-align: center;
    }

    header {
      padding: 25px 10px;
      background: #7c3aed;
      color: white;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .note {
      font-size: 14px;
      margin-top: 10px;
    }

    .ad-area {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
      background: white;
      border-radius: 12px;
    }

    .container {
      max-width: 850px;
      margin: 25px auto;
      padding: 25px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0,0,0,0.15);
    }

    .question {
      font-size: 22px;
      font-weight: bold;
      line-height: 1.7;
      margin: 25px 0;
    }

    .choices button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 15px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #ede9fe;
      color: #333;
      transition: 0.2s;
    }

    .choices button:hover {
      background: #ddd6fe;
      transform: scale(1.02);
    }

    .choices button.selected {
      background: #c4b5fd;
      font-weight: bold;
    }

    .choices button:disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }

    .progress {
      margin-top: 15px;
      color: #777;
    }

    .result {
      display: none;
      line-height: 1.8;
    }

    .result-title {
      font-size: 32px;
      color: #7c3aed;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .type-code {
      font-size: 42px;
      color: #4c1d95;
      font-weight: bold;
      margin: 15px 0;
    }

    .score-box {
      margin-top: 20px;
      font-size: 16px;
      color: #5b21b6;
      font-weight: bold;
      line-height: 1.8;
    }

    .restart {
      margin-top: 25px;
      padding: 14px 30px;
      font-size: 17px;
      border: none;
      border-radius: 999px;
      background: #7c3aed;
      color: white;
      cursor: pointer;
    }

    .restart:hover {
      background: #6d28d9;
    }
  </style>
</head>
<body>

<header>
  <h1>MBTI風性格クイズ</h1>
  <div class="note">※これはMBTI公式診断ではなく、エンタメ用の性格診断風クイズです。</div>
</header>

<div class="ad-area">
  <!-- チェス -->
  <ins class="adsbygoogle"
    style="display:block"
    data-ad-client="ca-pub-8398161859137802"
    data-ad-slot="5599163841"
    data-ad-format="auto"
    data-full-width-responsive="true"></ins>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>

<div class="container">
  <div id="quiz">

    <div class="choices" id="choices"></div>
    <div class="progress" id="progress"></div>
  </div>

  <div class="result" id="result">
    <div class="result-title">あなたのMBTI風タイプは...</div>
    <div class="type-code" id="typeCode"></div>
    <div id="resultText"></div>
    <div class="score-box" id="scoreBox"></div>
    <button class="restart" onclick="restartQuiz()">もう一度診断する</button>
  </div>
</div>

<script>
const questions = [
  {

  },
  {

      { text: "相手の気持ちを重視する", axis: "TF", value: "F" },
      { text: "筋が通っているか考える", axis: "TF", value: "T" },
      { text: "場の空気が悪くならないようにする", axis: "TF", value: "F" }
    ]
  },
  {
    q: "旅行に行くなら？",
    choices: [
      { text: "計画を立てて安心して行きたい", axis: "JP", value: "J" },
      { text: "その場の流れで楽しみたい", axis: "JP", value: "P" },
      { text: "予約や時間を先に決めたい", axis: "JP", value: "J" },
      { text: "気分で行き先を変えたい", axis: "JP", value: "P" }
    ]
  },
  {
    q: "大人数の集まりでは？",
    choices: [
      { text: "いろんな人と話すと元気になる", axis: "EI", value: "E" },
      { text: "楽しいけど少し疲れる", axis: "EI", value: "I" },
      { text: "場を盛り上げる方が好き", axis: "EI", value: "E" },
      { text: "少人数で深く話したい", axis: "EI", value: "I" }
    ]
  },
  {
    q: "説明を聞く時に好きなのは？",
    choices: [
      { text: "たとえ話やイメージ", axis: "SN", value: "N" },
      { text: "数字や事実", axis: "SN", value: "S" },
      { text: "新しいアイデア", axis: "SN", value: "N" },
      { text: "実例や経験談", axis: "SN", value: "S" }
    ]
  },
  {
    q: "友人が悩んでいる時、あなたは？",
    choices: [
      { text: "解決策を考える", axis: "TF", value: "T" },
      { text: "まず気持ちを受け止める", axis: "TF", value: "F" },
      { text: "原因を整理する", axis: "TF", value: "T" },
      { text: "共感してそばにいる", axis: "TF", value: "F" }
    ]
  },
  {
    q: "締切がある作業では？",
    choices: [
      { text: "早めに終わらせたい", axis: "JP", value: "J" },
      { text: "ギリギリで集中することが多い", axis: "JP", value: "P" },
      { text: "予定表を作って進める", axis: "JP", value: "J" },
      { text: "気分が乗った時に一気にやる", axis: "JP", value: "P" }
    ]
  },
  {
    q: "初対面の人と話す時は？",
    choices: [
      { text: "自分から話しかけることが多い", axis: "EI", value: "E" },
      { text: "相手から話しかけられるのを待つ", axis: "EI", value: "I" },
      { text: "会話を広げるのが得意", axis: "EI", value: "E" },
      { text: "慣れるまで様子を見る", axis: "EI", value: "I" }
    ]
  },
  {

    choices: [
      { text: "可能性や将来性を見る", axis: "SN", value: "N" },
      { text: "現実的にできるかを見る", axis: "SN", value: "S" },
      { text: "アイデアを広げる", axis: "SN", value: "N" },
      { text: "確実な方法を選ぶ", axis: "SN", value: "S" }
    ]
  },
  {

    choices: [
      { text: "合理性", axis: "TF", value: "T" },
      { text: "人への影響", axis: "TF", value: "F" },
      { text: "メリット・デメリット", axis: "TF", value: "T" },
      { text: "納得感や気持ち", axis: "TF", value: "F" }
    ]
  },
  {
    q: "予定変更が起きた時、あなたは？",
    choices: [
      { text: "少し落ち着かない", axis: "JP", value: "J" },
      { text: "むしろ新鮮で楽しい", axis: "JP", value: "P" },
      { text: "すぐ代案を決めたい", axis: "JP", value: "J" },
      { text: "流れに任せる", axis: "JP", value: "P" }
    ]
  },
  {
    q: "エネルギーが回復するのは？",
    choices: [
      { text: "人と話した後", axis: "EI", value: "E" },
      { text: "一人時間を過ごした後", axis: "EI", value: "I" },
      { text: "外に出て刺激を受けた後", axis: "EI", value: "E" },
      { text: "静かな場所で休んだ後", axis: "EI", value: "I" }
    ]
  },
  {
    q: "あなたが得意なのは？",
    choices: [
      { text: "新しい発想を出すこと", axis: "SN", value: "N" },
      { text: "現実的に形にすること", axis: "SN", value: "S" },
      { text: "未来を想像すること", axis: "SN", value: "N" },
      { text: "細かい変化に気づくこと", axis: "SN", value: "S" }
    ]
  },
  {
    q: "注意される時、納得しやすいのは？",
    choices: [
      { text: "理由が論理的な時", axis: "TF", value: "T" },
      { text: "言い方が優しい時", axis: "TF", value: "F" },
      { text: "根拠がはっきりしている時", axis: "TF", value: "T" },
      { text: "自分の気持ちも考えてくれる時", axis: "TF", value: "F" }
    ]
  },
  {
    q: "部屋や作業環境は？",
    choices: [
      { text: "整理されている方が落ち着く", axis: "JP", value: "J" },
      { text: "多少散らかっていても気にしない", axis: "JP", value: "P" },
      { text: "物の場所を決めたい", axis: "JP", value: "J" },
      { text: "必要な時に見つかればいい", axis: "JP", value: "P" }
    ]
  },
  {
    q: "会話でよくするのは？",
    choices: [
      { text: "話しながら考えをまとめる", axis: "EI", value: "E" },
      { text: "考えてから話す", axis: "EI", value: "I" },
      { text: "リアクションが大きい", axis: "EI", value: "E" },
      { text: "聞き役になることが多い", axis: "EI", value: "I" }
    ]
  },
  {
    q: "好きな話題は？",
    choices: [
      { text: "夢や未来の話", axis: "SN", value: "N" },
      { text: "日常や実体験の話", axis: "SN", value: "S" },
      { text: "もしもの話", axis: "SN", value: "N" },
      { text: "役立つ情報の話", axis: "SN", value: "S" }
    ]
  },
  {
    q: "人から相談された時、言いがちなのは？",
    choices: [
      { text: "つまり原因はこれかも", axis: "TF", value: "T" },
      { text: "それはつらかったね", axis: "TF", value: "F" },
      { text: "こうすれば解決できそう", axis: "TF", value: "T" },
      { text: "まず無理しないでね", axis: "TF", value: "F" }
    ]
  },
  {
    q: "買い物をする時は？",
    choices: [
      { text: "買うものを決めて行く", axis: "JP", value: "J" },
      { text: "見ながら決める", axis: "JP", value: "P" },
      { text: "比較してから買う", axis: "JP", value: "J" },
      { text: "直感で買うことも多い", axis: "JP", value: "P" }
    ]
  },
  {
    q: "褒められて嬉しいのは？",
    choices: [
      { text: "話していて楽しい", axis: "EI", value: "E" },
      { text: "落ち着いていて安心する", axis: "EI", value: "I" },
      { text: "明るいね", axis: "EI", value: "E" },
      { text: "深く考えているね", axis: "EI", value: "I" }
    ]
  },
  {
    q: "問題を解く時、あなたは？",
    choices: [
      { text: "ひらめきを大事にする", axis: "SN", value: "N" },
      { text: "手順通りに進める", axis: "SN", value: "S" },
      { text: "別の見方を探す", axis: "SN", value: "N" },
      { text: "確実な情報を集める", axis: "SN", value: "S" }
    ]
  },
  {
    q: "冷たいと言われることがある？",
    choices: [
      { text: "合理的に考えるだけ", axis: "TF", value: "T" },
      { text: "あまり言われない", axis: "TF", value: "F" },
      { text: "感情より結論を優先しがち", axis: "TF", value: "T" },
      { text: "人の気持ちはかなり気にする", axis: "TF", value: "F" }
    ]
  },
  {
    q: "やることリストについては？",
    choices: [
      { text: "作ると安心する", axis: "JP", value: "J" },
      { text: "あまり作らない", axis: "JP", value: "P" },
      { text: "チェックして消すのが好き", axis: "JP", value: "J" },
      { text: "その時やりたい順に進める", axis: "JP", value: "P" }
    ]
  },
  {
    q: "あなたに近いのは？",
    choices: [
      { text: "外の刺激で元気になる", axis: "EI", value: "E" },
      { text: "内側の世界を大切にする", axis: "EI", value: "I" },
      { text: "人と関わるほど調子が出る", axis: "EI", value: "E" },
      { text: "一人で考える時間が必要", axis: "EI", value: "I" }
    ]
  },
  {
    q: "アイデアを出す時は？",
    choices: [
      { text: "自由に広げたい", axis: "SN", value: "N" },
      { text: "実現できる範囲で考えたい", axis: "SN", value: "S" },
      { text: "普通と違う発想が好き", axis: "SN", value: "N" },
      { text: "今ある材料を活かしたい", axis: "SN", value: "S" }
    ]
  },
  {
    q: "議論で大事なのは？",
    choices: [
      { text: "結論の正しさ", axis: "TF", value: "T" },
      { text: "お互いの気持ち", axis: "TF", value: "F" },
      { text: "矛盾がないこと", axis: "TF", value: "T" },
      { text: "関係が壊れないこと", axis: "TF", value: "F" }
    ]
  },
  {
    q: "急な誘いには？",
    choices: [
      { text: "予定が崩れると困る", axis: "JP", value: "J" },
      { text: "面白そうなら行く", axis: "JP", value: "P" },
      { text: "先に確認してから決める", axis: "JP", value: "J" },
      { text: "ノリで決めることが多い", axis: "JP", value: "P" }
    ]
  },
  {
    q: "自分を一言で表すなら？",
    choices: [
      { text: "社交的", axis: "EI", value: "E" },
      { text: "内省的", axis: "EI", value: "I" },
      { text: "行動的", axis: "EI", value: "E" },
      { text: "慎重", axis: "EI", value: "I" }
    ]
  },
  {
    q: "最後に、あなたが惹かれるのは？",
    choices: [
      { text: "大きな可能性", axis: "SN", value: "N" },
      { text: "確かな実績", axis: "SN", value: "S" },
      { text: "新しい世界観", axis: "SN", value: "N" },
      { text: "現実的な安心感", axis: "SN", value: "S" }
    ]
  }
];

let currentQuestion = 0;
let scores = {
  E: 0, I: 0,
  S: 0, N: 0,
  T: 0, F: 0,
  J: 0, P: 0
};
let answered = false;

const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const progressEl = document.getElementById("progress");
const quizEl = document.getElementById("quiz");
const resultEl = document.getElementById("result");
const typeCodeEl = document.getElementById("typeCode");
const resultTextEl = document.getElementById("resultText");
const scoreBoxEl = document.getElementById("scoreBox");

function showQuestion() {
  answered = false;
  const q = questions[currentQuestion];

  questionEl.textContent = q.q;
  choicesEl.innerHTML = "";

  q.choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.textContent = choice.text;
    btn.onclick = () => selectAnswer(choice.value, btn);
    choicesEl.appendChild(btn);
  });

  progressEl.textContent = `${currentQuestion + 1} / ${questions.length}`;
}

function selectAnswer(value, button) {
  if (answered) return;
  answered = true;

  scores[value]++;
  button.classList.add("selected");

  document.querySelectorAll(".choices button").forEach(btn => {
    btn.disabled = true;
  });

  setTimeout(() => {
    currentQuestion++;

    if (currentQuestion < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }, 700);
}

function showResult() {
  quizEl.style.display = "none";
  resultEl.style.display = "block";

  const type =
    (scores.E >= scores.I ? "E" : "I") +
    (scores.S >= scores.N ? "S" : "N") +
    (scores.T >= scores.F ? "T" : "F") +
    (scores.J >= scores.P ? "J" : "P");

  const resultData = {
    ISTJ: "責任感が強く、コツコツ積み上げる現実派タイプ。約束やルールを大切にし、信頼されやすい人です。",
    ISFJ: "やさしく献身的なサポータータイプ。周囲をよく見ていて、人のために自然と動ける人です。",
    INFJ: "深く考える理想家タイプ。人の気持ちに敏感で、自分なりの信念を大切にします。",
    INTJ: "戦略的に物事を進める設計者タイプ。未来を見据えて計画を立てるのが得意です。",
    ISTP: "冷静に状況を見極める職人タイプ。必要な時に素早く動ける実践派です。",
    ISFP: "感性を大切にする自由人タイプ。やわらかい雰囲気があり、自分らしさを大切にします。",
    INFP: "理想と感受性を持つ夢想家タイプ。自分の価値観を大切にし、深い共感力があります。",
    INTP: "知的好奇心が強い分析家タイプ。なぜそうなるのかを考えるのが好きです。",
    ESTP: "行動力のあるチャレンジャータイプ。勢いと判断力があり、場を動かす力があります。",
    ESFP: "明るく人を楽しませるエンタメタイプ。今を楽しむ力があり、周囲を笑顔にします。",
    ENFP: "可能性を広げるアイデアマンタイプ。人との関わりや新しい挑戦にワクワクしやすいです。",
    ENTP: "発想力と会話力のある討論家タイプ。新しい視点を出すのが得意です。",
    ESTJ: "現実的に物事を動かすリーダータイプ。段取りや管理が得意で、頼られやすい人です。",
    ESFJ: "人をつなぐ世話焼きタイプ。場の空気を読み、周囲に安心感を与えます。",
    ENFJ: "人を導くカリスマタイプ。相手の可能性を信じ、チームを前向きにできます。",
    ENTJ: "目標達成に強い指揮官タイプ。判断力と行動力があり、大きな成果を狙えます。"
  };

  typeCodeEl.textContent = type;
  resultTextEl.textContent = resultData[type];

  scoreBoxEl.innerHTML = `
    外向E：${scores.E} / 内向I：${scores.I}<br>
    現実S：${scores.S} / 直感N：${scores.N}<br>
    思考T：${scores.T} / 感情F：${scores.F}<br>
    計画J：${scores.J} / 柔軟P：${scores.P}
  `;
}

function restartQuiz() {
  currentQuestion = 0;
  scores = {
    E: 0, I: 0,
    S: 0, N: 0,
    T: 0, F: 0,
    J: 0, P: 0
  };
  quizEl.style.display = "block";
  resultEl.style.display = "none";
  showQuestion();
}

showQuestion();
</script>

</body>
</html>
